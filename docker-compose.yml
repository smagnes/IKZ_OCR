networks:
  medyk_net:
    driver: bridge
services:
  grafana:
    container_name: medyk_grafana
    depends_on:
    - prometheus
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=medyk2026
    - GF_USERS_ALLOW_SIGN_UP=false
    image: ikz-gl.ib2.eu:5050/medyk/reg:grafana
    networks:
    - medyk_net
    ports:
    - 3001:3000
    restart: unless-stopped
    volumes:
    - grafana_data:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
  nats:
    container_name: medyk_nats
    image: ikz-gl.ib2.eu:5050/medyk/reg:nats
    networks:
    - medyk_net
    ports:
    - 4222:4222
    - 8222:8222
    restart: unless-stopped
  ocr-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: medyk_ocr_api
    depends_on:
      redis:
        condition: service_healthy
    env_file:
    - ./api/.env
    environment: []
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 90s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      timeout: 10s
    image: medyk-ocr-api:latest
    networks:
    - medyk_net
    ports:
    - 8000:8000
    restart: unless-stopped
    volumes:
    - ocr_models:/root/.cache/huggingface
  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    container_name: medyk_panel
    depends_on:
    - ocr-api
    environment:
    - NEXT_PUBLIC_API_URL=http://localhost:8000
    - NEXT_PUBLIC_API_KEY=mk_prod_demo123
    image: medyk-ocr-panel:latest
    networks:
    - medyk_net
    ports:
    - 3000:3000
    restart: unless-stopped
  prometheus:
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    container_name: medyk_prometheus
    image: ikz-gl.ib2.eu:5050/medyk/reg:prometheus
    networks:
    - medyk_net
    ports:
    - 9090:9090
    restart: unless-stopped
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
  redis:
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    container_name: medyk_redis
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:7-alpine
    networks:
    - medyk_net
    ports:
    - 6379:6379
    restart: unless-stopped
    volumes:
    - redis_data:/data
version: '3.9'
volumes:
  grafana_data: null
  ocr_models: null
  postgres_data: null
  prometheus_data: null
  redis_data: null
