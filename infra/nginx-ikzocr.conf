server {
    server_name api.ikzocr.pl;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        client_max_body_size 25M;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        error_page 502 503 504 /maintenance.html;
    }

    location = /maintenance.html {
        root /home/smgraphic4u/www;
        internal;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.ikzocr.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ikzocr.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name panel.ikzocr.pl;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        error_page 502 503 504 /maintenance.html;
    }

    location = /maintenance.html {
        root /home/smgraphic4u/www;
        internal;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.ikzocr.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ikzocr.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = api.ikzocr.pl) { return 301 https://$host$request_uri; }
    listen 80; server_name api.ikzocr.pl; return 404;
}

server {
    if ($host = panel.ikzocr.pl) { return 301 https://$host$request_uri; }
    listen 80; server_name panel.ikzocr.pl; return 404;
}
