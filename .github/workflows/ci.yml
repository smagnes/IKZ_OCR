name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — lint + syntax + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir fastapi "uvicorn[standard]" python-multipart pydantic pydantic-settings pypdf pdf2image asyncpg redis nats-py "python-jose[cryptography]" bcrypt httpx python-dotenv anthropic Pillow requests ruff

      - name: Lint (ruff)
        run: ruff check . --select E,F,W --ignore E501

      - name: Syntax check
        run: python -m py_compile main.py db.py demo.py

      - name: Tests
        run: python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: ""
          JWT_SECRET: test-secret-only-ci
          ANTHROPIC_API_KEY: sk-ant-test
          OCR_ENGINE: claude
          REDIS_URL: ""

  panel:
    name: Panel — type check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.ikzocr.pl
